name: Report

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Name artifact
        id: meta
        run: echo "name=journey-change-log-v$(node -p "require('./package.json').version")-$(cut -c1-12 dist/journey-change-log.html.sha256)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: |
            dist/journey-change-log.html
            dist/journey-change-log.html.sha256
          if-no-files-found: error
