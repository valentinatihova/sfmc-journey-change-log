<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--__CSP__-->
<title>Journey Change Log</title>
<style>
/*__FONTS__*/
:root {
  color-scheme: light;
  --fog: #eef1f4; --surface: #ffffff; --sunk: #f6f8fa; --ink: #16212e; --ink-2: #3f4b5a; --muted: #5b6878;
  --line: #d5dce4; --line-soft: #e6ebf0;
  --tested: #2a78d6; --edited: #eb6834; --quick: #8f9aa8; --unknown: #d5dce4; --focus: #2a78d6;
  --gone: #eb6834; --gone-2: #fbe2d6; --warn: #fff4e5; --warn-line: #f2c58b; --warn-ink: #a4500f;
  --note: #fff7e6; --note-line: #f0d9a8; --error: #d03b3b;
  --seq-0: #edf1f5; --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec; --seq-4: #3987e5; --seq-5: #256abf; --seq-6: #184f95;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --fog: #0f1419; --surface: #171d24; --sunk: #1d242c; --ink: #eef2f6; --ink-2: #c9d1da; --muted: #93a0ae;
    --line: #2c3540; --line-soft: #232b34; --tested: #3987e5; --edited: #d95926; --quick: #6b7685; --unknown: #39424d;
    --gone: #d95926; --gone-2: #3a2418; --warn: #2b2116; --warn-line: #5a4325; --warn-ink: #f0a868;
    --note: #2a2417; --note-line: #4a3f26; --error: #e66767;
    --seq-0: #1d242c; --seq-1: #173153; --seq-2: #184f95; --seq-3: #256abf; --seq-4: #3987e5; --seq-5: #6da7ec; --seq-6: #9ec5f4;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --fog: #0f1419; --surface: #171d24; --sunk: #1d242c; --ink: #eef2f6; --ink-2: #c9d1da; --muted: #93a0ae;
  --line: #2c3540; --line-soft: #232b34; --tested: #3987e5; --edited: #d95926; --quick: #6b7685; --unknown: #39424d;
  --gone: #d95926; --gone-2: #3a2418; --warn: #2b2116; --warn-line: #5a4325; --warn-ink: #f0a868;
  --note: #2a2417; --note-line: #4a3f26; --error: #e66767;
  --seq-0: #1d242c; --seq-1: #173153; --seq-2: #184f95; --seq-3: #256abf; --seq-4: #3987e5; --seq-5: #6da7ec; --seq-6: #9ec5f4;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--fog); color: var(--ink); font: 15px/1.5 "Onest", -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-feature-settings: "tnum" 1; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }

.app-head { background: var(--surface); border-bottom: 1px solid var(--line); }
.app-head .row { max-width: 1320px; margin: 0 auto; padding: 14px 24px 0; display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 17px; letter-spacing: -.01em; }
.ctx { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
.ctx select { border: 1px solid var(--line); background: var(--sunk); border-radius: 6px; padding: 4px 8px; }
.head-tools { margin-left: auto; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--tested); width: 16px; height: 16px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 3px 9px; font-size: 13px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.tabs { max-width: 1320px; margin: 0 auto; padding: 0 16px; display: flex; gap: 2px; overflow-x: auto; }
.tab { border: 0; background: none; padding: 12px 12px 11px; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; font-weight: 500; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }

main { max-width: 1320px; margin: 0 auto; padding: 28px 24px 64px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
body.notes-on .layout { grid-template-columns: minmax(0, 1fr) 300px; }
@media (max-width: 1080px) { body.notes-on .layout { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; margin-top: 20px; }
.card:first-child { margin-top: 0; }
.card h2 { font-size: 16px; margin: 0 0 4px; font-weight: 600; }
.hint { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
.sub { color: var(--muted); margin: 0; font-size: 14px; }
.empty { color: var(--muted); padding: 28px 0; text-align: center; }
.split2 { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 20px; margin-top: 20px; }
.split2 > .card { margin-top: 0; }
@media (max-width: 900px) { .split2 { grid-template-columns: minmax(0, 1fr); } }

/* History: retention countdown */
.count { display: grid; grid-template-columns: auto 1fr; gap: 6px 28px; align-items: end; }
.count .big { font-size: 76px; line-height: .9; font-weight: 700; letter-spacing: -.03em; white-space: nowrap; }
.count .big small { font-size: 28px; font-weight: 600; letter-spacing: -.01em; margin-left: 6px; }
.count .lead { font-size: 22px; line-height: 1.3; font-weight: 600; letter-spacing: -.01em; max-width: 34ch; margin: 0; text-wrap: balance; }
@media (max-width: 640px) { .count { grid-template-columns: 1fr; } .count .big { font-size: 56px; } .count .lead { font-size: 18px; } }
.days { display: grid; grid-template-columns: repeat(30, 1fr); gap: 3px; margin: 22px 0 8px; }
.days span { height: 26px; border-radius: 3px; background: var(--tested); opacity: .85; }
.days span.gone { background: repeating-linear-gradient(135deg, var(--gone) 0 3px, var(--gone-2) 3px 6px); opacity: 1; }
.days span.empty { background: var(--line-soft); opacity: 1; }
.daylbl { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 5px 0 10px; vertical-align: -1px; }
.stat { margin: 14px 0 0; font-size: 14px; color: var(--ink-2); }

/* Launch log */
.tools { display: flex; gap: 10px; align-items: center; margin: 0 0 14px; flex-wrap: wrap; }
.tools input[type=search] { flex: 1; min-width: 200px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: var(--sunk); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; font-size: 13px; color: var(--ink-2); background: var(--surface); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12.5px; }
td.n, th.n { text-align: right; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--sunk); }
.tw { overflow-x: auto; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; white-space: nowrap; }
.badge i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.tag { font-size: 11.5px; color: var(--warn-ink); background: var(--warn); border: 1px solid var(--warn-line); border-radius: 5px; padding: 0 5px; margin-left: 6px; white-space: nowrap; }
.muted { color: var(--muted); }
.more { margin: 12px 0 0; }
.linkbtn { border: 0; background: none; color: var(--tested); padding: 0; cursor: pointer; font-weight: 500; }

/* Most changed */
.top { list-style: none; margin: 0; padding: 0; }
.top li { display: grid; grid-template-columns: minmax(0, 1fr) 140px 32px; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line-soft); cursor: pointer; }
.top li:hover .nm { color: var(--tested); }
.top .nm { font-weight: 500; overflow-wrap: break-word; min-width: 0; }
.top .k { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
.spark { width: 140px; height: 18px; display: block; }

/* Publish control */
.kinds { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.kind .frac { font-size: 44px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
.kind .frac small { font-size: 20px; color: var(--muted); font-weight: 600; }
.kind .lbl { font-weight: 600; margin-top: 6px; }
.kind .units { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 12px; }
.kind .units i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
.caveat { font-size: 13px; color: var(--muted); margin: 16px 0 0; border-top: 1px solid var(--line-soft); padding-top: 12px; }
.alert { background: var(--warn); border: 1px solid var(--warn-line); border-radius: 12px; padding: 18px 20px; display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin-top: 20px; }
.alert .num { font-size: 40px; font-weight: 700; line-height: 1; color: var(--warn-ink); grid-row: span 2; }
.alert b { font-size: 16px; } .alert span { color: var(--ink-2); font-size: 14px; }
.preview { display: flex; gap: 12px; align-items: flex-start; background: var(--sunk); border: 1px dashed var(--line); border-radius: 8px; padding: 14px; }
.switch { width: 34px; height: 20px; border-radius: 10px; background: var(--line); position: relative; flex: none; margin-top: 2px; }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); }
.preview b { display: block; } .preview span { color: var(--muted); font-size: 13px; }

/* Campaign evidence */
.ev { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 20px; }
@media (max-width: 860px) { .ev { grid-template-columns: 1fr; } }
.jlist { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px; max-height: 720px; overflow-y: auto; }
.jlist button { display: grid; grid-template-columns: 1fr auto; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.jlist button[aria-current="true"] { background: var(--sunk); font-weight: 600; }
.jlist button span { color: var(--muted); font-size: 12.5px; }
.ev .card { margin-top: 0; }
.ev-head { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.ev-head h2 { font-size: 24px; letter-spacing: -.01em; margin: 0; overflow-wrap: break-word; }
.ev-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 7px 12px; cursor: pointer; font-size: 14px; font-weight: 500; }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn[disabled] { color: var(--muted); cursor: not-allowed; background: var(--sunk); }
.facts { display: flex; gap: 34px; flex-wrap: wrap; margin: 14px 0 18px; }
.facts div { font-size: 13px; color: var(--muted); }
.facts b { display: block; font-size: 22px; color: var(--ink); font-weight: 650; }
.vlog { list-style: none; margin: 6px 0 0; padding: 0; position: relative; }
.vlog::before { content: ""; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 2px; background: var(--line-soft); }
.vlog li { position: relative; padding: 0 0 18px 30px; }
.vlog li::before { content: ""; position: absolute; left: 2px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--c); border: 2px solid var(--surface); }
.vlog .t { font-weight: 600; } .vlog .m { color: var(--muted); font-size: 13px; }
.locked { font-size: 13px; color: var(--muted); background: var(--sunk); border: 1px dashed var(--line); border-radius: 8px; padding: 12px 14px; margin-top: 6px; }

/* Team */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
.kpi .big2 { font-size: 40px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
.kpi .lbl { font-weight: 600; margin-top: 6px; } .kpi .sub { font-size: 13px; }
.pbar { height: 10px; border-radius: 3px; background: var(--tested); display: inline-block; vertical-align: middle; margin-right: 8px; }
.heat { width: 100%; max-width: 900px; height: auto; display: block; }
.heat .tick { fill: var(--muted); font-size: 11px; }

/* Data */
.slider { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.slider input[type=range] { width: 220px; accent-color: var(--tested); }
.sblist { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 6px 18px; }
.sblist label { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
.sblist input { accent-color: var(--edited); margin-top: 3px; }

/* Drop screen */
.drop { max-width: 760px; margin: 24px auto 0; }
.zone { border: 2px dashed var(--line); border-radius: 14px; background: var(--surface); padding: 36px 24px; text-align: center; }
.zone.over { border-color: var(--tested); background: var(--sunk); }
.zone h1 { font-size: 24px; letter-spacing: -.01em; margin: 0 0 8px; }
.zone p { color: var(--muted); margin: 0 0 18px; }
.zone .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.files { margin-top: 16px; display: grid; gap: 8px; }
.files .f { display: grid; grid-template-columns: 1fr 180px auto; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
.files input { border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; background: var(--sunk); width: 100%; }
.howto { margin-top: 18px; font-size: 14px; color: var(--ink-2); }
.howto ol { margin: 6px 0 0; padding-left: 20px; }
.privacy { margin-top: 14px; font-size: 13px; color: var(--muted); }
.err { margin-top: 16px; border: 1px solid var(--error); border-left-width: 4px; border-radius: 8px; padding: 12px 14px; background: var(--surface); }
.err b { color: var(--error); display: block; margin-bottom: 2px; }
.err .actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }

.notes { display: none; }
body.notes-on .notes { display: block; }
.note { background: var(--note); border: 1px solid var(--note-line); border-radius: 12px; padding: 16px; position: sticky; top: 16px; font-size: 14px; }
.note h3 { font-size: 14px; margin: 0 0 6px; }
.note p { margin: 0 0 12px; color: var(--ink-2); } .note p:last-child { margin: 0; }
.note .q { font-style: italic; color: var(--ink); }

#tip { position: fixed; z-index: 10; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12.5px; line-height: 1.4; padding: 7px 9px; border-radius: 6px; max-width: 300px; opacity: 0; transition: opacity .08s; white-space: pre-line; }
.foot { color: var(--muted); font-size: 12.5px; margin-top: 28px; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
@media (prefers-reduced-motion: reduce) { #tip { transition: none; } }
@media (max-width: 640px) { .daylbl span:nth-child(2) { order: 3; flex-basis: 100%; } .files .f { grid-template-columns: 1fr; } main { padding: 20px 16px 48px; } .app-head .row { padding: 12px 16px 0; } }
@media print {
  .app-head, .notes, .jlist, .ev-head .actions, #tip, .foot { display: none !important; }
  body { background: #fff; }
  .ev { grid-template-columns: 1fr; }
  .card { break-inside: avoid; border-color: #ccc; }
}
</style>
</head>
<body>

<header class="app-head">
  <div class="row">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="6" fill="var(--ink)"/><path d="M5 9h16M5 17h16" stroke="var(--surface)" stroke-width="1.4" opacity=".5"/><rect x="8" y="5.5" width="2.4" height="7" rx="1.2" fill="#3987e5"/><rect x="14" y="5.5" width="2.4" height="7" rx="1.2" fill="#eb6834"/><rect x="11" y="13.5" width="2.4" height="7" rx="1.2" fill="#3987e5"/><rect x="17" y="13.5" width="2.4" height="7" rx="1.2" fill="#8f9aa8"/></svg>
      Journey Change Log
    </div>
    <div class="ctx" id="ctx" hidden>
      <label for="bu">BU</label><select id="bu"></select>
      <span id="period"></span>
      <label for="tz" id="l-tz"></label><select id="tz"></select>
    </div>
    <div class="head-tools">
      <label class="toggle" id="names-wrap" hidden><input type="checkbox" id="names-toggle" checked> <span id="l-names"></span></label>
      <label class="toggle" id="notes-wrap" hidden><input type="checkbox" id="notes-toggle"> <span id="l-notes"></span></label>
      <button class="btn" id="other-files" hidden></button>
      <div class="seg" role="group" aria-label="Language"><button id="lang-ru" aria-pressed="true">RU</button><button id="lang-en" aria-pressed="false">EN</button></div>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist" hidden>
    <button class="tab" role="tab" data-tab="history" aria-selected="true"></button>
    <button class="tab" role="tab" data-tab="control" aria-selected="false"></button>
    <button class="tab" role="tab" data-tab="campaigns" aria-selected="false"></button>
    <button class="tab" role="tab" data-tab="team" aria-selected="false"></button>
    <button class="tab" role="tab" data-tab="data" aria-selected="false"></button>
  </nav>
</header>

<main>
  <section id="drop" class="drop" hidden></section>
  <div id="report" hidden>
    <section class="panel" id="p-history" role="tabpanel"><div class="layout"><div id="history"></div><aside class="notes" id="n-history"></aside></div></section>
    <section class="panel" id="p-control" role="tabpanel" hidden><div class="layout"><div id="control"></div><aside class="notes" id="n-control"></aside></div></section>
    <section class="panel" id="p-campaigns" role="tabpanel" hidden><div class="layout"><div id="campaigns"></div><aside class="notes" id="n-campaigns"></aside></div></section>
    <section class="panel" id="p-team" role="tabpanel" hidden><div class="layout"><div id="team"></div><aside class="notes" id="n-team"></aside></div></section>
    <section class="panel" id="p-data" role="tabpanel" hidden><div class="layout"><div id="data"></div><aside class="notes" id="n-data"></aside></div></section>
    <div class="foot" id="foot"></div>
  </div>
</main>
<div id="tip" role="tooltip"></div>

<script type="application/json" id="dataset">__DATA__</script>
<script type="application/json" id="sample">__SAMPLE__</script>
<script>
(() => {
/*__CORE__*/

// ── i18n ─────────────────────────────────────────────────────────────────────
const VERSION = document.querySelector('meta[name=generator]')?.content.replace('journey-change-log ', '') || 'dev';
const rp = (n, one, few, many) => { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 10 || b >= 20) ? few : many; };
const L = {
  ru: {
    tz: 'Часовой пояс выгрузки', notes: 'Пояснения для презентации', names: 'Показывать имена', otherFiles: 'Другие файлы', allBu: 'Все BU',
    period: (a, b) => `история с ${a} по ${b}`,
    tabs: { history: 'История', control: 'Проверка перед запуском', campaigns: 'Кампании', team: 'Команда', data: 'Данные' },
    kind: { campaign: 'разовая', daily: 'ежедневная', journey: 'постоянная (триггерная)' },
    kindCap: { campaign: 'Разовые кампании', daily: 'Ежедневные рассылки', journey: 'Постоянные (триггерные)' },
    cls: { tested: 'Проверена в Test', edited: 'Без Test после правок', quick_copy: 'Перезапуск без правок', unknown: 'Нет данных о проверке' },
    sandboxTag: 'тестовая',
    person: n => `Специалист ${n}`,
    alias: { campaign: (n, m) => `Кампания ${n}${m ? ` (${m})` : ''}`, daily: n => `Ежедневная рассылка ${n}`, journey: n => `Сценарий ${n}` },
    n: { days: n => `${n} ${rp(n, 'день', 'дня', 'дней')}`, launches: n => `${n} ${rp(n, 'запуск', 'запуска', 'запусков')}`, camps: n => `${n} ${rp(n, 'кампании', 'кампаниям', 'кампаниям')}`,
      people: n => `${n} ${rp(n, 'сотрудник', 'сотрудника', 'сотрудников')}`, changes: n => `${n} ${rp(n, 'изменение', 'изменения', 'изменений')}`, authors: n => rp(n, 'автор', 'автора', 'авторов') },
    countLead: (del, oldest) => `До ${del} SFMC начнёт удалять историю изменений. Первыми исчезнут изменения от ${oldest}, дальше по одному дню.`,

  const b = h('button', { class: 'linkbtn', title: t().diagHint, onclick: async () => { try { await navigator.clipboard.writeText(diagnostics()); b.textContent = t().diagDone; } catch { prompt(t().diag, diagnostics()); } } }, t().diag);
  return b;
}

// ── drop screen ──────────────────────────────────────────────────────────────
function renderDrop() {
  const T = t(), D = T.drop, root = document.getElementById('drop');
  root.replaceChildren();
  const input = h('input', { type: 'file', accept: '.csv,text/csv', multiple: true, hidden: true, 'data-testid': 'file-input' });
  input.addEventListener('change', () => addFiles(input.files));
  const zone = h('div', { class: 'zone' }, h('h1', {}, D.title), h('p', {}, D.sub),
    h('div', { class: 'actions' }, h('button', { class: 'btn primary', onclick: () => input.click() }, D.pick),
      sampleCsv ? h('button', { class: 'btn', 'data-testid': 'sample-btn', onclick: () => { S.files = [{ name: 'sample.csv', text: sampleCsv, bu: 'Demo' }]; S.dateOrder = undefined; go(); } }, D.sample) : null),
    input);
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('over'));
  zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('over'); addFiles(e.dataTransfer.files); });
  root.append(zone);
  if (S.files.length) root.append(h('div', { class: 'files' }, S.files.map((f, i) => h('div', { class: 'f' }, h('span', {}, f.name),
      h('input', { value: f.bu || DEFAULT_BU, 'aria-label': `${D.bu} ${f.name}`, oninput: e => { f.bu = e.target.value; } }),
      h('button', { class: 'linkbtn', onclick: () => { S.files.splice(i, 1); S.error = null; renderDrop(); } }, D.remove)))),
    h('p', { style: 'margin:12px 0 0' }, h('button', { class: 'btn primary', 'data-testid': 'build-btn', onclick: go }, D.build)));
  if (S.error) {
    const [title, hint] = T.err[S.error.code];
    root.append(h('div', { class: 'err', role: 'alert', 'data-testid': 'error', 'data-code': S.error.code },
      h('b', {}, title), h('div', {}, hint), S.error.file ? h('div', { class: 'sub', style: 'margin-top:4px' }, T.fileLabel(S.error.file)) : null,
      h('div', { class: 'actions' },
        S.error.code === 'AMBIGUOUS_DATE' ? [h('button', { class: 'btn', 'data-testid': 'date-mdy', onclick: () => { S.dateOrder = 'MDY'; go(); } }, T.mdy), h('button', { class: 'btn', 'data-testid': 'date-dmy', onclick: () => { S.dateOrder = 'DMY'; go(); } }, T.dmy)] : null,
        diagButton())));
  }
  root.append(h('div', { class: 'howto' }, h('b', {}, D.howto), h('ol', {}, D.steps.map(x => h('li', {}, x)))), h('p', { class: 'privacy' }, D.privacy, ` v${VERSION}`));
}
async function addFiles(list) {
  for (const f of list) S.files.push({ name: f.name, text: await f.text(), bu: DEFAULT_BU });
  S.error = null; S.dateOrder = undefined;
  renderDrop();
}
function go() { S.bu = '*'; S.showAllRecent = false; S.overrides = {}; if (rebuild()) { S.tab = 'history'; render(); } else showDrop(); }
function showDrop() {
  for (const id of ['report', 'tabs', 'ctx', 'names-wrap', 'notes-wrap', 'other-files']) document.getElementById(id).hidden = true;
  document.getElementById('drop').hidden = false;
  renderDrop();
}

// ── chrome + render ──────────────────────────────────────────────────────────
function renderChrome() {
  const T = t(), D = S.data;
  document.documentElement.lang = S.lang;
  document.getElementById('lang-ru').setAttribute('aria-pressed', S.lang === 'ru');
  document.getElementById('lang-en').setAttribute('aria-pressed', S.lang === 'en');
  document.getElementById('l-notes').textContent = T.notes;
  document.getElementById('l-names').textContent = T.names;
  document.getElementById('other-files').textContent = T.otherFiles;
  document.querySelectorAll('.tab').forEach(b => { b.textContent = T.tabs[b.dataset.tab]; b.setAttribute('aria-selected', b.dataset.tab === S.tab); });
  if (!D) return;
  document.getElementById('l-tz').textContent = T.tz;
  const bus = S.base.bus, bu = document.getElementById('bu');
  bu.replaceChildren(...(bus.length > 1 ? [h('option', { value: '*' }, T.allBu)] : []), ...bus.map(b => h('option', { value: b }, b)));
  bu.value = bus.length > 1 ? S.bu : bus[0];
  bu.disabled = bus.length < 2;
  const tz = document.getElementById('tz');
  if (!tz.options.length) {
    const zones = Array.from({ length: 27 }, (_, i) => tzLabel((i - 12) * 60));
    if (!zones.includes(S.tz)) zones.push(S.tz);
    for (const v of zones) tz.append(h('option', { value: v }, v));
  }
  tz.value = S.tz;
  document.getElementById('period').textContent = T.period(day(ms(D.period.start)), dayY(ms(D.period.end)));
  document.getElementById('names-wrap').hidden = D.anonymized;
  document.getElementById('other-files').hidden = !S.files.length;
  document.getElementById('foot').replaceChildren(h('span', {}, T.foot(D.anonymized || !S.showNames)), h('span', {}, `Journey Change Log v${VERSION}`), diagButton());
}
function render() {
  tip.style.opacity = 0;
  renderChrome();
  if (!S.data) return showDrop();
  document.getElementById('drop').hidden = true;
  for (const id of ['report', 'tabs', 'ctx', 'notes-wrap']) document.getElementById(id).hidden = false;
  const R = { history: renderHistory, control: renderControl, campaigns: renderCampaigns, team: renderTeam, data: renderData };
  for (const [tab, fn] of Object.entries(R)) {
    const panel = document.getElementById('p-' + tab), root = document.getElementById(tab), note = document.getElementById('n-' + tab);
    panel.hidden = tab !== S.tab;
    root.replaceChildren(); note.replaceChildren();
    if (tab !== S.tab) continue;
    if (!S.data.totals.versions && tab !== 'data') root.append(h('div', { class: 'card' }, h('p', { class: 'empty', 'data-testid': 'empty' }, t().empty)));
    else fn(root);
    note.append(h('div', { class: 'note' }, t().notesBy[tab].map(([a, b], i) => [h('h3', {}, a), h('p', { class: i === 2 ? 'q' : null }, b)])));
  }
}
function activate(tab) { S.tab = tab; render(); scrollTo({ top: 0 }); }

// ── events ───────────────────────────────────────────────────────────────────
const tabs = [...document.querySelectorAll('.tab')];
tabs.forEach(b => b.addEventListener('click', () => activate(b.dataset.tab)));
document.getElementById('tabs').addEventListener('keydown', e => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const i = tabs.findIndex(b => b.dataset.tab === S.tab), n = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
  activate(n.dataset.tab); n.focus();
});
const setLang = lang => { S.lang = lang; S.data ? render() : (renderChrome(), renderDrop()); };
document.getElementById('lang-ru').addEventListener('click', () => setLang('ru'));
document.getElementById('lang-en').addEventListener('click', () => setLang('en'));
document.getElementById('notes-toggle').addEventListener('change', e => document.body.classList.toggle('notes-on', e.target.checked));
document.getElementById('names-toggle').addEventListener('change', e => { S.showNames = e.target.checked; render(); });
document.getElementById('bu').addEventListener('change', e => { S.bu = e.target.value; applyBu(); render(); });
document.getElementById('tz').addEventListener('change', e => { S.tz = e.target.value; render(); });
document.getElementById('other-files').addEventListener('click', () => { S.data = null; S.base = null; S.error = null; showDrop(); });

// ── start ────────────────────────────────────────────────────────────────────
renderChrome();
if (embedded) { rebuild(); render(); } else showDrop();
})();
</script>
